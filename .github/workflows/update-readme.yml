name: Update README

# Rebuilds the generated README sections whenever a module is added or changed,
# so the module list never needs a hand edit. The commit only touches README.md,
# which is outside the paths below, so it cannot trigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'scripts/update-readme.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate README sections
        run: node scripts/update-readme.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update README from module manifests"
            git push
          fi
